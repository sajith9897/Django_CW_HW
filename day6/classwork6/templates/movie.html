<!DOCTYPE html>
<html>
<head>
    <title>Movie Saver</title>
</head>

<body>

    <h2>Movie Saver</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Movie Name:</label>
        <input type="text" name="movie_name" required>

        <br><br>

        <label>Release Year:</label>
        <input type="number" name="release_year" required>

        <br><br>

        <button type="submit">Save Movie</button>

    </form>

    {% if message %}

        <h3>{{ message }}</h3>

    {% endif %}

</body>
</html>
