<!DOCTYPE html>
<html>
<head>
    <title>Movie Registration</title>
</head>
<body>

    <h2>Movie Registration Form</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Movie Name:</label>
        <input type="text" name="movie_name" required>

        <br><br>

        <label>Release Year:</label>
        <input type="number" name="release_year" required>

        <br><br>

        <button type="submit">Save Movie</button>

    </form>

</body>
</html>
