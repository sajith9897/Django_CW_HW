
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
    <link rel="stylesheet" href="{% static 'students/students.css' %}">
</head>
<body>

<header>
    <h2>EduCampus</h2>
    <a href="{% url 'homework9:home' %}">Back to Home</a>
</header>

<main class="container">

    <div class="heading">
        <h1>{{ message }}</h1>
        <p>College Student Directory</p>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Year</th>
                </tr>
            </thead>

            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.course }}</td>
                    <td>{{ student.year }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4">No students found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
