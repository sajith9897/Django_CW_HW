{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <link rel="stylesheet" href="{% static 'homework10/style.css' %}">
</head>
<body>

<div class="container">
    <h1>Student Management System</h1>

    <div class="toolbar">
        <a href="{% url 'add_student' %}" class="btn">Add Student</a>

        <form method="GET" class="search-form">
            <input type="text"
                   name="search"
                   placeholder="Search student by name"
                   value="{{ query }}">

            <button type="submit">Search</button>
            <a href="{% url 'student_list' %}">Clear</a>
        </form>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Class</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.student_class }}</td>
            <td>{{ student.age }}</td>
            <td>
                <a href="{% url 'edit_student' student.id %}">Edit</a>
                <a href="{% url 'delete_student' student.id %}" class="delete">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No students found.</td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
