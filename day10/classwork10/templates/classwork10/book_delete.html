{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Book</title>
    <link rel="stylesheet" href="{% static 'classwork10/style.css' %}">
</head>
<body>

<div class="container form-container">
    <h1>Delete Book</h1>

    <p>Are you sure you want to delete "{{ book.title }}"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="danger">Yes, Delete</button>
    </form>

    <a href="{% url 'book_list' %}">Cancel</a>
</div>

</body>
</html>
